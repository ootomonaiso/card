<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="'Segoe UI',system-ui,sans-serif">
  <style>
    .wire{stroke:#111;stroke-width:2;fill:none}
    .comp{stroke:#111;stroke-width:2;fill:none}
    .fillw{fill:#fff;stroke:#111;stroke-width:2}
    .node{fill:#111}
    .lbl{fill:#111;font-size:14px}
    .val{fill:#0b5bbf;font-size:14px;font-weight:600}
    .ttl{fill:#111;font-size:19px;font-weight:700}
    .note{fill:#222;font-size:13px}
    .rail{fill:#b00;font-size:14px;font-weight:700}
  </style>
  <rect x="0" y="0" width="880" height="620" fill="#ffffff"/>
  <text x="24" y="34" class="ttl">ロック駆動回路（MOSFET ローサイド方式） ― Raspberry Pi 4</text>

  <!-- +V rail -->
  <line x1="300" y1="90" x2="782" y2="90" class="wire"/>
  <text x="300" y="80" class="rail">+5V（ロック用電源）</text>

  <!-- GND rail -->
  <line x1="180" y1="470" x2="782" y2="470" class="wire"/>
  <text x="182" y="490" class="lbl">GND（Raspberry Pi と共通）</text>

  <!-- Raspberry Pi 4 -->
  <rect x="40" y="180" width="170" height="170" rx="10" class="fillw"/>
  <text x="125" y="250" text-anchor="middle" class="lbl" font-weight="700">Raspberry</text>
  <text x="125" y="270" text-anchor="middle" class="lbl" font-weight="700">Pi 4</text>
  <!-- GPIO17 pin -->
  <line x1="210" y1="230" x2="240" y2="230" class="wire"/>
  <circle cx="210" cy="230" r="3" class="node"/>
  <text x="206" y="222" text-anchor="end" class="lbl">GPIO17</text>
  <!-- GND pin -->
  <line x1="210" y1="320" x2="240" y2="320" class="wire"/>
  <circle cx="210" cy="320" r="3" class="node"/>
  <text x="206" y="325" text-anchor="end" class="lbl">GND</text>

  <!-- gate drive routing: GPIO17 -> Rg -> gate -->
  <polyline points="240,230 300,230 300,300 310,300" class="wire"/>
  <!-- Rg (series gate resistor, horizontal zigzag) -->
  <path d="M310,300 l6,0 l3,-9 l6,18 l6,-18 l6,18 l6,-18 l3,9 l9,0" class="comp"/>
  <text x="312" y="286" class="lbl">Rg <tspan class="val">220Ω</tspan></text>
  <line x1="355" y1="300" x2="420" y2="300" class="wire"/>
  <circle cx="390" cy="300" r="3.5" class="node"/>

  <!-- Rgs pull-down (gate node -> GND, vertical zigzag) -->
  <line x1="390" y1="300" x2="390" y2="322" class="wire"/>
  <path d="M390,322 l0,6 l-9,3 l18,6 l-18,6 l18,6 l-9,3 l0,6" class="comp"/>
  <line x1="390" y1="364" x2="390" y2="470" class="wire"/>
  <text x="400" y="350" class="lbl">Rgs <tspan class="val">10kΩ</tspan></text>
  <text x="400" y="366" class="note">プルダウン</text>

  <!-- MOSFET Q1 (N-ch enhancement) -->
  <!-- gate lead + electrode -->
  <line x1="420" y1="300" x2="452" y2="300" class="wire"/>
  <line x1="452" y1="278" x2="452" y2="322" class="comp"/>
  <!-- channel bar -->
  <line x1="466" y1="276" x2="466" y2="324" class="comp"/>
  <!-- drain lead (top) -->
  <polyline points="466,282 500,282 500,230" class="wire"/>
  <!-- source lead (bottom) -->
  <polyline points="466,318 500,318 500,470" class="wire"/>
  <!-- body tie to source + N-ch arrow (pointing toward channel = N-channel) -->
  <polyline points="466,300 490,300 490,318" class="wire"/>
  <polygon points="483,300 491,296 491,304" class="node"/>
  <text x="528" y="352" class="lbl" font-weight="700">Q1  N-ch MOSFET</text>
  <text x="528" y="368" class="note">ロジックレベル（例: IRLZ44N）</text>
  <!-- drain / source terminal letters -->
  <text x="508" y="248" class="note">D</text>
  <text x="508" y="440" class="note">S</text>
  <text x="430" y="292" class="note">G</text>
  <!-- drain node -->
  <circle cx="500" cy="230" r="3.5" class="node"/>
  <!-- source-to-GND node -->
  <circle cx="500" cy="470" r="3.5" class="node"/>

  <!-- Solenoid L (coil) between +V and drain node -->
  <line x1="500" y1="90" x2="500" y2="112" class="wire"/>
  <circle cx="500" cy="90" r="3.5" class="node"/>
  <path d="M500,112 q18,11 0,22 q18,11 0,22 q18,11 0,22 q18,11 0,22 q18,11 0,22" class="comp"/>
  <line x1="500" y1="212" x2="500" y2="230" class="wire"/>
  <text x="478" y="150" text-anchor="end" class="lbl" font-weight="700">ソレノイドロック LE-53</text>
  <text x="478" y="168" text-anchor="end" class="note">DC5V / 2W（≈0.4A）通電時解錠</text>

  <!-- Flyback diode D1 parallel to the coil -->
  <polyline points="610,90 610,166" class="wire"/>
  <circle cx="610" cy="90" r="3.5" class="node"/>
  <!-- cathode bar (toward +V) -->
  <line x1="596" y1="168" x2="624" y2="168" class="comp"/>
  <!-- triangle apex up (anode at bottom -> cathode on top) -->
  <polygon points="596,196 624,196 610,170" class="fillw"/>
  <polyline points="610,196 610,230 500,230" class="wire"/>
  <text x="634" y="176" class="lbl" font-weight="700">D1</text>
  <text x="634" y="192" class="note">還流ダイオード</text>
  <text x="634" y="208" class="note">1N4007 等</text>

  <!-- DC source (lock power) on the right -->
  <polyline points="720,90 720,252" class="wire"/>
  <circle cx="720" cy="90" r="3.5" class="node"/>
  <line x1="702" y1="252" x2="738" y2="252" class="comp"/>
  <line x1="710" y1="266" x2="730" y2="266" class="comp"/>
  <line x1="702" y1="280" x2="738" y2="280" class="comp"/>
  <line x1="710" y1="294" x2="730" y2="294" class="comp"/>
  <polyline points="720,294 720,470" class="wire"/>
  <circle cx="720" cy="470" r="3.5" class="node"/>
  <text x="744" y="248" class="rail">+</text>
  <text x="746" y="300" class="lbl">−</text>
  <text x="700" y="330" text-anchor="middle" class="note">ロック用</text>
  <text x="700" y="346" text-anchor="middle" class="note">DC5V</text>

  <!-- ground symbol -->
  <line x1="640" y1="470" x2="640" y2="492" class="wire"/>
  <circle cx="640" cy="470" r="3.5" class="node"/>
  <line x1="622" y1="492" x2="658" y2="492" class="comp"/>
  <line x1="628" y1="499" x2="652" y2="499" class="comp"/>
  <line x1="634" y1="506" x2="646" y2="506" class="comp"/>

  <!-- Pi GND down to rail -->
  <polyline points="240,320 272,320 272,470" class="wire"/>
  <circle cx="272" cy="470" r="3.5" class="node"/>

  <!-- notes -->
  <text x="24" y="546" class="note">① 施錠は人手。GPIO17 を HIGH で数秒だけ ON にして解錠し、その後必ず OFF へ（連続通電しない：NFR-08）。</text>
  <text x="24" y="566" class="note">② 還流ダイオード D1 は必須。OFF 時にコイルが生む逆起電力（サージ）から Q1 を保護する。</text>
  <text x="24" y="586" class="note">③ ロック用電源は Pi と分離推奨。ただし GND は必ず共通に接続する（基準電位をそろえる）。</text>
  <text x="24" y="606" class="note">④ LE-53＝DC5V・2W（≈0.4A, タキゲン）。電源は 5V/1A 以上が目安。Q1 は 0.4A 以上のロジックレベル MOSFET（例: IRLZ44N）。</text>
</svg>
