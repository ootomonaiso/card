<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" font-family="'Segoe UI',system-ui,sans-serif">
  <style>
    .wire{stroke:#334155;stroke-width:2.2;fill:none;stroke-linecap:round}
    .comp{stroke:#334155;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .fillw{fill:#ffffff;stroke:#334155;stroke-width:2.2}
    .node{fill:#334155}
    .lbl{fill:#1f2937;font-size:14px}
    .val{fill:#4f46e5;font-size:14px;font-weight:700}
    .ref{fill:#0f172a;font-size:14px;font-weight:800}
    .ttl{fill:#0f172a;font-size:20px;font-weight:800}
    .note{fill:#475569;font-size:13px}
    .rail{fill:#e11d48;font-size:15px;font-weight:800}
    .railpos{stroke:#e11d48;stroke-width:2.6;fill:none;stroke-linecap:round}
    .railgnd{stroke:#475569;stroke-width:2.6;fill:none;stroke-linecap:round}
    .chip{font-size:13px;font-weight:800;fill:#ffffff}
  </style>
  <rect x="0" y="0" width="960" height="740" fill="#ffffff"/>
  <rect x="8" y="8" width="944" height="724" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="26" y="40" class="ttl">ロック駆動回路（LM393 ゲートドライバ + 2SK4017 ローサイド） ― Raspberry Pi 4</text>
  <line x1="26" y1="50" x2="300" y2="50" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
  <!-- 能動素子を引き立てるアクセントカード（配線より先に敷く） -->
  <rect x="392" y="286" width="116" height="118" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <rect x="620" y="306" width="92" height="78" rx="14" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>

  <!-- +5V rail -->
  <line x1="250" y1="100" x2="920" y2="100" class="railpos"/>
  <rect x="250" y="79" width="48" height="20" rx="10" fill="#e11d48"/>
  <text x="274" y="93" text-anchor="middle" class="chip">+5V</text>
  <text x="306" y="93" class="note">ロック用電源・LM393/ゲート駆動 共通（GND共通）</text>
  <!-- GND rail -->
  <line x1="180" y1="580" x2="920" y2="580" class="railgnd"/>
  <rect x="182" y="589" width="46" height="20" rx="10" fill="#475569"/>
  <text x="205" y="603" text-anchor="middle" class="chip">GND</text>
  <text x="236" y="603" class="note">Raspberry Pi と共通</text>

  <!-- Raspberry Pi 4 -->
  <rect x="40" y="250" width="160" height="150" rx="10" class="fillw"/>
  <text x="120" y="318" text-anchor="middle" class="lbl" font-weight="700">Raspberry</text>
  <text x="120" y="338" text-anchor="middle" class="lbl" font-weight="700">Pi 4</text>
  <!-- GPIO17 pin -->
  <line x1="200" y1="285" x2="230" y2="285" class="wire"/>
  <circle cx="200" cy="285" r="3" class="node"/>
  <text x="196" y="278" text-anchor="end" class="lbl">GPIO17</text>
  <!-- GND pin -->
  <line x1="200" y1="360" x2="230" y2="360" class="wire"/>
  <circle cx="200" cy="360" r="3" class="node"/>
  <text x="196" y="365" text-anchor="end" class="lbl">GND</text>
  <polyline points="230,360 230,580" class="wire"/>
  <circle cx="230" cy="580" r="3.5" class="node"/>

  <!-- GPIO17 -> IN+ (non-inverting) -->
  <polyline points="230,285 380,285 380,320 405,320" class="wire"/>
  <text x="300" y="278" class="note">3.3V ロジック</text>

  <!-- Reference divider R1/R2 -> IN- (inverting), ~1.6V -->
  <polyline points="300,100 300,140" class="wire"/>
  <circle cx="300" cy="100" r="3.5" class="node"/>
  <path d="M300,140 l0,6 l-9,3 l18,6 l-18,6 l18,6 l-9,3 l0,6" class="comp"/>
  <text x="312" y="162" class="lbl">R1 <tspan class="val">10kΩ</tspan></text>
  <polyline points="300,176 300,205" class="wire"/>
  <circle cx="300" cy="205" r="3.5" class="node"/>
  <text x="250" y="200" text-anchor="end" class="val">≈1.6V</text>
  <polyline points="300,205 300,235" class="wire"/>
  <path d="M300,235 l0,6 l-9,3 l18,6 l-18,6 l18,6 l-9,3 l0,6" class="comp"/>
  <text x="312" y="257" class="lbl">R2 <tspan class="val">4.7kΩ</tspan></text>
  <polyline points="300,271 300,580" class="wire"/>
  <circle cx="300" cy="580" r="3.5" class="node"/>
  <!-- Vref branch to IN- -->
  <polyline points="300,205 360,205 360,368 405,368" class="wire"/>
  <text x="300" y="412" class="note">基準電圧（分圧）</text>

  <!-- Comparator LM393 (1 of 2) -->
  <polygon points="405,300 405,390 495,345" class="fillw"/>
  <text x="430" y="342" class="lbl" font-weight="700">LM393N</text>
  <text x="405" y="430" class="note">U1 コンパレータ（1/2・オープンコレクタ出力）</text>
  <text x="414" y="324" class="lbl" font-weight="700">+</text>
  <text x="414" y="376" class="lbl" font-weight="700">−</text>
  <!-- V+ and GND power leads -->
  <polyline points="430,312 430,100" class="wire"/>
  <circle cx="430" cy="100" r="3.5" class="node"/>
  <text x="436" y="150" class="note">V+(8)</text>
  <polyline points="430,378 430,580" class="wire"/>
  <circle cx="430" cy="580" r="3.5" class="node"/>
  <text x="436" y="560" class="note">GND(4)</text>
  <!-- Output (open collector) -->
  <polyline points="495,345 525,345" class="wire"/>
  <circle cx="525" cy="345" r="3.5" class="node"/>
  <text x="500" y="338" class="note">OUT(1)</text>

  <!-- Pull-up Rpu from +5V to OUT node -->
  <polyline points="525,100 525,140" class="wire"/>
  <circle cx="525" cy="100" r="3.5" class="node"/>
  <path d="M525,140 l0,6 l-9,3 l18,6 l-18,6 l18,6 l-9,3 l0,6" class="comp"/>
  <text x="537" y="232" class="lbl">Rpu <tspan class="val">1kΩ</tspan></text>
  <text x="537" y="248" class="note">プルアップ</text>
  <polyline points="525,176 525,345" class="wire"/>

  <!-- Rg series gate resistor: OUT -> gate -->
  <polyline points="525,345 545,345" class="wire"/>
  <path d="M545,345 l6,0 l3,-9 l6,18 l6,-18 l6,18 l6,-18 l3,9 l9,0" class="comp"/>
  <text x="543" y="331" class="lbl">Rg <tspan class="val">100Ω</tspan></text>
  <polyline points="590,345 600,345" class="wire"/>
  <circle cx="600" cy="345" r="3.5" class="node"/>

  <!-- Rgs pull-down: gate -> GND -->
  <polyline points="600,345 600,367" class="wire"/>
  <path d="M600,367 l0,6 l-9,3 l18,6 l-18,6 l18,6 l-9,3 l0,6" class="comp"/>
  <polyline points="600,403 600,580" class="wire"/>
  <circle cx="600" cy="580" r="3.5" class="node"/>
  <text x="610" y="392" class="lbl">Rgs <tspan class="val">10kΩ</tspan></text>
  <text x="610" y="408" class="note">プルダウン</text>

  <!-- Q1 2SK4017 (N-ch enhancement) -->
  <line x1="600" y1="345" x2="632" y2="345" class="wire"/>
  <line x1="632" y1="323" x2="632" y2="367" class="comp"/>
  <line x1="646" y1="321" x2="646" y2="369" class="comp"/>
  <!-- drain lead (top) -->
  <polyline points="646,327 680,327 680,215" class="wire"/>
  <!-- source lead (bottom) -->
  <polyline points="646,363 680,363 680,580" class="wire"/>
  <circle cx="680" cy="580" r="3.5" class="node"/>
  <!-- body tie + N-ch arrow -->
  <polyline points="646,345 670,345 670,363" class="wire"/>
  <polygon points="663,345 671,341 671,349" class="node"/>
  <text x="712" y="340" class="lbl" font-weight="700">Q1  2SK4017（N-ch）</text>
  <text x="712" y="356" class="note">TO-220F ピン: G–D–S（東芝）</text>
  <text x="712" y="372" class="note">ゲート駆動 ≈5V（LM393でレベルシフト）</text>
  <text x="658" y="322" class="note">D</text>
  <text x="658" y="382" class="note">S</text>
  <text x="612" y="338" class="note">G</text>
  <circle cx="680" cy="215" r="3.5" class="node"/>

  <!-- Solenoid L (coil) between +V and drain node -->
  <line x1="680" y1="100" x2="680" y2="120" class="wire"/>
  <circle cx="680" cy="100" r="3.5" class="node"/>
  <path d="M680,120 q18,11 0,22 q18,11 0,22 q18,11 0,22 q18,11 0,22" class="comp"/>
  <line x1="680" y1="208" x2="680" y2="215" class="wire"/>
  <text x="660" y="158" text-anchor="end" class="lbl" font-weight="700">ソレノイドロック LE-53</text>
  <text x="660" y="176" text-anchor="end" class="note">DC5V / 2W（≈0.4A）通電時解錠</text>

  <!-- Flyback diode D1 parallel to the coil -->
  <polyline points="770,100 770,168" class="wire"/>
  <circle cx="770" cy="100" r="3.5" class="node"/>
  <line x1="756" y1="170" x2="784" y2="170" class="comp"/>
  <polygon points="756,198 784,198 770,172" class="fillw"/>
  <polyline points="770,198 770,215 680,215" class="wire"/>
  <text x="794" y="178" class="lbl" font-weight="700">D1</text>
  <text x="794" y="194" class="note">還流ダイオード</text>
  <text x="794" y="210" class="note">1N4007 等</text>

  <!-- DC source (lock power) on the right -->
  <polyline points="860,100 860,250" class="wire"/>
  <circle cx="860" cy="100" r="3.5" class="node"/>
  <line x1="842" y1="250" x2="878" y2="250" class="comp"/>
  <line x1="850" y1="264" x2="870" y2="264" class="comp"/>
  <line x1="842" y1="278" x2="878" y2="278" class="comp"/>
  <line x1="850" y1="292" x2="870" y2="292" class="comp"/>
  <polyline points="860,292 860,580" class="wire"/>
  <circle cx="860" cy="580" r="3.5" class="node"/>
  <text x="884" y="246" class="rail">+</text>
  <text x="886" y="298" class="lbl">−</text>
  <text x="840" y="440" text-anchor="middle" class="note">ロック用</text>
  <text x="840" y="456" text-anchor="middle" class="note">DC5V</text>

  <!-- ground symbol -->
  <line x1="740" y1="580" x2="740" y2="602" class="wire"/>
  <circle cx="740" cy="580" r="3.5" class="node"/>
  <line x1="722" y1="602" x2="758" y2="602" class="comp"/>
  <line x1="728" y1="609" x2="752" y2="609" class="comp"/>
  <line x1="734" y1="616" x2="746" y2="616" class="comp"/>

  <!-- notes -->
  <text x="24" y="636" class="note">① 施錠は人手。GPIO17 を HIGH で数秒だけ ON にして解錠し、その後必ず OFF（連続通電しない：NFR-08）。極性は従来どおり HIGH=解錠（lock_active_high=true）。</text>
  <text x="24" y="656" class="note">② LM393 は 3.3V GPIO を基準電圧（≈1.6V, R1/R2）と比較する非反転レベルシフタ。GPIO HIGH→出力オープン→Rpu でゲート≈5V→Q1 ON。2SK4017 はロジックレベル品でないため 5V で確実にオンさせる。</text>
  <text x="24" y="676" class="note">③ Rg でゲートを保護、Rgs で確実オフ。LM393 はオープンコレクタのため Rpu 必須。未使用側コンパレータは入力を固定（例: +入力=GND / −入力=+5V）して発振を防ぐ。LM393 直近に 0.1µF パスコンを置く。</text>
  <text x="24" y="696" class="note">④ 還流ダイオード D1 必須（逆起電力から Q1 保護）。ロック用電源は Pi と分離推奨・GND は共通。</text>
  <text x="24" y="716" class="note">⑤ LE-53＝DC5V・2W（≈0.4A, タキゲン）。突入電流が未公表のため電源は 5V/2A 以上を目安。より強い駆動が要るなら LM393 とゲートを +12V 別電源にして Vgs を上げる（ソレノイドは 5V のまま）。</text>
</svg>
