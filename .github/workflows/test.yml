name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 実機（Raspberry Pi OS Bookworm）に合わせる
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest tests -q
